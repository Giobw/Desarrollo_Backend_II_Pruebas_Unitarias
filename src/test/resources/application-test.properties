# Perfil "test": base H2 en memoria, para ejecutar las pruebas sin MySQL ni Docker.
spring.datasource.url=jdbc:h2:mem:petsalud_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# No cargar los usuarios demo: cada prueba crea sus propios datos
app.seed-demo-users=false
